<script id="md-source" type="text/plain"># 金锁玉关 · 全书总览

## 先说这是什么
- 二十四山为全图，一山十五度
- 八宫各统三山，卦看格局、山看落点
- 当前精读坎、坤、震三卦九山
- 内容只有一份 Markdown 源
- 网页、导图、书稿同源生成，不互相转抄
- 底本：12 讲课程笔记、经文讲义、老师批语

## 四条线怎么分工
- Ⅰ 课程线（12 页，一讲一页）
  - 写：理法与技法怎么一步步推进
  - 写：为什么先判砂水、再取用神、再立太极、最后逐山解经
  - 不写：经文逐句细目（在 Ⅱ 线）
  - 不写：老师批语原文（在 Ⅲ 线）
- Ⅱ 卦山线（3 页，一卦一页）
  - 写：卦体（论断／见水／见砂／应期／兼卦）
  - 写：三山各八段，见水见砂、形煞、技法、自译经文
  - 写：差异与存疑，底本冲突逐条留痕
  - 不写：把课堂案例再讲一遍（在 Ⅰ 线）
- Ⅲ 作业线（12 页：总表＋11 次）
  - 写：题面、老师批语、答案落在哪一节
  - 写：状态看板（已完成／未完成、已批阅／未批阅）
  - 不写：把 Ⅱ 已讲的话再说一遍
- 附录（5 篇，跨页公共件）
  - 经文对照总表
  - 技法总章
  - 术语表
  - 存疑清单
  - 二十四山速查

## 四种读法
- 想系统学：Ⅰ 线从第 1 讲顺序读
- 想查一座山：Ⅱ 线按卦进，或首页罗盘按山点
- 想知道老师怎么判：Ⅲ 线看批语与「已判过的错」
- 想先看骨架：本图，再看九山总览与三卦分图

## 十二讲推进
- 1 预热课：金锁凭什么值得学
- 2 宏观大局与砂水：判准从哪来
- 3 子山根器：先学自身
- 4 壬山与金锁用神：相中取独
- 5 坎卦三山经文（上）
- 6 坎卦三山经文（下）
- 7 坤卦（上）：四海之内都哥们
- 8 坤卦（下）
- 9 坤卦三山经文
- 10 震·奋起：净场增局
- 11 震卦三山经文（上）
- 12 震卦三山经文（下）

## 九山已成篇
- 坎 · 壬子癸（一白）·藏
  - 壬：财商，敢不敢挣
  - 子：财库，存不存得住
  - 癸：理财，守不守得住
- 坤 · 未坤申（二黑）·养
  - 未：利润，先谈利益
  - 坤：家运，养不养人
  - 申：链接，通不通外
- 震 · 甲卯乙（三碧）·动
  - 甲：有没有劲
  - 卯：跟谁互动
  - 乙：怎么用

## 一卦三山总规律
- 中间山主健康与身体
- 两侧山主人事，人事应完才落到身体
- 三山常成一对阴阳：壬癸、甲与乙、未与申
- 三元龙：地元＝有没有，天元＝根本，人元＝怎么用

## 作业与批阅
- 11 次作业
- 已交 5，未交 6
- 已批阅 3，待批 2，未交未批 6
- 六至十一是按题面回填，不是实际提交
- 状态改动只动 _数据/作业状态.json

## 六条硬口径（判过的错）
- 火尖砂，不叫破军砂
- 马路算砂，不当虚看
- 冰箱判砂，不判水
- 真水最强，看蒸发
- 三合是同一件事的三个阶段，不是同一五行
- 只有大太极、小太极，没有中太极

<script>
var mm = null;
function zoomBy(f){ if(mm) mm.rescale(f); }
// 自适应缩放的唯一可靠来源是 markmap 自己算的 mm.state.rect（全部节点矩形并集）
// 不要用 svg.querySelector('g').getBBox()：命中的是最外层高亮层，只会返回根节点大小，
// 算出来会放大 4 倍多、把整棵树推到画布外（已踩过）。
function fitNow(ratio){
  if(!mm) return 0;
  try{
    var svgEl = document.getElementById('mind');
    var box = svgEl.getBoundingClientRect();
    var r = mm.state && mm.state.rect;
    if(!r || !isFinite(r.x1) || !isFinite(r.x2)) return 0;
    var w = Math.max(1, r.x2 - r.x1), h = Math.max(1, r.y2 - r.y1);
    var s = Math.min(box.width / w, box.height / h) * (ratio || 0.95);
    if(!isFinite(s) || s <= 0) return 0;
    s = Math.min(s, 1.25);
    var tx = (box.width - w * s) / 2 - r.x1 * s;
    var ty = (box.height - h * s) / 2 - r.y1 * s;
    mm.svg.call(mm.zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(s));
    return s;
  }catch(e){ return 0; }
}
function toggleAll(){
  if(!mm) return;
  var nodes = mm.state.data ? mm.state.data.children||[] : [];
  var anyOpen = false;
  (function walk(ns){ ns.forEach(function(n){ if(n.payload && n.payload.fold===0){ anyOpen=true; } walk(n.children||[]); }); })(nodes);
  (function walk(ns){ ns.forEach(function(n){ if(n.payload) n.payload.fold = anyOpen?1:0; walk(n.children||[]); }); })(nodes);
  mm.renderData();
}
try{
  var src = document.getElementById('md-source').textContent;
  var T = window.markmap.Transformer, M = window.markmap.Markmap;
  var t = new T();
  var res = t.transform(src);
  mm = M.create('#mind', {autoFit:true, duration:0, maxInitialScale:1.25, initialExpandLevel:2, spacingVertical:12, paddingX:16, colorFreezeLevel:2}, res.root);
  window.mm = mm;
  requestAnimationFrame(function(){ fitNow(); });
  setTimeout(function(){ fitNow(); }, 300);
  setTimeout(function(){ fitNow(); }, 900);
  window.addEventListener('resize', function(){ fitNow(); });
}catch(e){
  document.getElementById('mind').insertAdjacentHTML('afterend','<p style="color:#a3543a">脑图渲染失败：'+e.message+'</p>');
}
</script>
